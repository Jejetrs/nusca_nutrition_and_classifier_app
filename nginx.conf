# Penyajian SPA (React + Vite) untuk NutriScan AI.
# URL backend sudah disuntik saat build via VITE_API_BASE, sehingga frontend
# memanggil backend secara langsung — nginx cukup menyajikan berkas statis.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aset dengan hash boleh di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA: semua rute diarahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
